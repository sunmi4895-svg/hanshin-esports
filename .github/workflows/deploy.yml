# main 브랜치에 push 하면 GitHub Pages 로 자동 배포됩니다.
# 최초 1회: 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 지정하세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # 저장소 Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'           # 정적 사이트라 빌드 없이 폴더 전체를 그대로 올립니다

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
