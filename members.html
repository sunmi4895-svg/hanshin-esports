<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>랩 구성원 · 이스포츠 연구실</title>
<meta name="description" content="연구실 교수진과 학생 연구원을 소개합니다." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="members">

<a class="skip" href="#main">본문 바로가기</a>

<!-- 상단바는 data.js 의 NAV 를 읽어 app.js 가 자동으로 넣습니다 -->
<header class="topbar" id="siteHeader"></header>

<main id="main">

    <section class="pagehead" id="pageHead"></section>
  <section class="sec">
    <div class="wrap">

      <!-- 탭 : 교수진 / 재학생 -->
      <div class="tools" role="tablist" aria-label="구성원 분류">
               <button class="chip" role="tab" aria-selected="true"  data-mtab="faculty">교수진</button>
        <button class="chip" role="tab" aria-selected="false" data-mtab="students">대학원생</button>
        <button class="chip" role="tab" aria-selected="false" data-mtab="alumni">졸업생</button>
        <span class="count" id="memCount"></span>
      </div>

      <!-- 교수진 : data.js 의 FACULTY -->
      <div id="panelFaculty">
        <div id="facultyList"></div>
      </div>

           <!-- 대학원생 : data.js 의 STUDENTS -->
      <div id="panelStudents" hidden>
        <div class="students" id="studentList"></div>
      </div>

      <!-- 졸업생 : data.js 의 ALUMNI -->
      <div id="panelAlumni" hidden>
        <div class="students" id="alumniList"></div>
      </div>
    </div>
  </section>

  <!-- 구성원 상세 창 (카드를 누르면 열립니다) -->
  <div class="modal" id="memberModal" hidden role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-panel" id="modalPanel">
      <button class="modal-close" id="modalClose" type="button" aria-label="닫기">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

</main>

<!-- 푸터도 자동으로 채워집니다 -->
<footer id="siteFooter"></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
